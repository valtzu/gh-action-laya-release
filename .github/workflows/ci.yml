name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: bump
        uses: ./
      - run: echo "${{ steps.bump.outputs.current-version }} -> ${{ steps.bump.outputs.next-version }} (${{ steps.bump.outputs.bump }})"
      - if: github.event_name == 'push' && steps.bump.outputs.bump != 'none'
        run: gh release create "${{ steps.bump.outputs.next-tag }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
