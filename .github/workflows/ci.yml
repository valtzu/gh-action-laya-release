name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: bump
        uses: ./
      - run: echo "${{ steps.bump.outputs.current-version }} -> ${{ steps.bump.outputs.next-version }} (${{ steps.bump.outputs.bump }})"
